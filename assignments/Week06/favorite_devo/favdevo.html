<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <h2>Table of Favorites</h2>
        <table class="devo-table">
          <thead>
            <tr>
              <th>Speaker</th>
              <th>Title</th>
              <th>Location</th>
              <th>Year</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Russell M. Nelson</td>
              <td>The Love and Laws of God</td>
              <td>BYU&ndash;Provo</td>
              <td>2019</td>
            </tr>
            <tr>
              <td>Jeffrey R. Holland</td>
              <td>The First Great Commandment</td>
              <td>BYU&ndash;Idaho</td>
              <td>2012</td>
            </tr>
            <tr>
              <td>Dieter F. Uchtdorf</td>
              <td>Your Happily Ever After</td>
              <td>BYU&ndash;Idaho</td>
              <td>2010</td>
            </tr>
          </tbody>
        </table>

        <h2>Add a Devotional</h2>
        <form class="devo-form" action="#" method="post">
          <div class="form-row">
            <label for="speaker">Speaker</label>
            <input type="text" id="speaker" name="speaker" placeholder="e.g. Russell M. Nelson" required />
          </div>
          <div class="form-row">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="e.g. The Love and Laws of God" required />
          </div>
          <div class="form-row">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" placeholder="e.g. BYU&ndash;Idaho" required />
          </div>
          <div class="form-row">
            <label for="year">Year</label>
            <input type="number" id="year" name="year" min="1900" max="2100" placeholder="e.g. 2019" required />
          </div>
          <button type="submit">Add Devotional</button>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
