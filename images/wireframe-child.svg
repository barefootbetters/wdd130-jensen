<svg xmlns="http://www.w3.org/2000/svg" width="700" height="900" viewBox="0 0 700 900" font-family="Arial, sans-serif">
  <rect width="700" height="900" fill="#ffffff" stroke="#333" stroke-width="2"/>

  <!-- Header -->
  <rect x="10" y="10" width="680" height="70" fill="#dbe4ec" stroke="#334" stroke-width="1.5"/>
  <circle cx="55" cy="45" r="22" fill="#ffffff" stroke="#334" stroke-width="1.5"/>
  <text x="55" y="49" font-size="12" text-anchor="middle" fill="#334">LOGO</text>
  <text x="120" y="42" font-size="15" fill="#334" font-weight="bold">Jeff Jensen — Web Developer</text>
  <text x="120" y="62" font-size="12" fill="#556">site title / tagline</text>
  <text x="500" y="50" font-size="13" fill="#334">Home | About | Projects</text>

  <!-- Nav bar -->
  <rect x="10" y="88" width="680" height="34" fill="#c3d3df" stroke="#334" stroke-width="1"/>
  <text x="350" y="110" font-size="13" text-anchor="middle" fill="#334">NAV: Home &#160;&#160; About Me &#160;&#160; Projects</text>

  <!-- Page title -->
  <rect x="10" y="132" width="680" height="60" fill="#eef2f5" stroke="#334" stroke-width="1.5"/>
  <text x="30" y="170" font-size="20" fill="#334" font-weight="bold">Page Title (h1)</text>

  <!-- Intro text -->
  <rect x="10" y="204" width="680" height="90" fill="#f5f7f9" stroke="#334" stroke-width="1.5"/>
  <text x="30" y="235" font-size="12" fill="#556">Significant textual content — intro paragraph(s) that explain</text>
  <text x="30" y="255" font-size="12" fill="#556">the meaning and message of this page for the audience.</text>

  <!-- Two-column: image + text -->
  <rect x="10" y="308" width="330" height="220" fill="#dbe4ec" stroke="#556" stroke-dasharray="4"/>
  <text x="175" y="420" font-size="13" text-anchor="middle" fill="#556">IMAGE 1 (relates to content)</text>
  <rect x="352" y="308" width="338" height="220" fill="#f5f7f9" stroke="#334" stroke-width="1.5"/>
  <text x="372" y="340" font-size="12" fill="#334">Body content:</text>
  <text x="372" y="362" font-size="12" fill="#556">paragraphs, lists, or a table</text>
  <text x="372" y="384" font-size="12" fill="#556">supporting the page topic.</text>

  <!-- Full-width section with second image -->
  <rect x="10" y="544" width="680" height="200" fill="#f5f7f9" stroke="#334" stroke-width="1.5"/>
  <rect x="30" y="564" width="300" height="160" fill="#dbe4ec" stroke="#556" stroke-dasharray="4"/>
  <text x="180" y="648" font-size="13" text-anchor="middle" fill="#556">IMAGE 2 (relates to content)</text>
  <text x="360" y="610" font-size="12" fill="#334">More content + working links</text>
  <text x="360" y="632" font-size="12" fill="#556">&#8594; Home &#160;&#160; &#8594; other child page</text>

  <!-- Footer -->
  <rect x="10" y="760" width="680" height="70" fill="#dbe4ec" stroke="#334" stroke-width="1.5"/>
  <text x="350" y="790" font-size="13" text-anchor="middle" fill="#334">FOOTER</text>
  <text x="350" y="812" font-size="11" text-anchor="middle" fill="#556">copyright · contact · social links</text>
</svg>
