<svg xmlns="http://www.w3.org/2000/svg" width="700" height="960" viewBox="0 0 700 960" font-family="Arial, sans-serif">
  <rect width="700" height="960" fill="#ffffff" stroke="#333" stroke-width="2"/>

  <!-- Header -->
  <rect x="10" y="10" width="680" height="70" fill="#dbe4ec" stroke="#334" stroke-width="1.5"/>
  <circle cx="55" cy="45" r="22" fill="#ffffff" stroke="#334" stroke-width="1.5"/>
  <text x="55" y="49" font-size="12" text-anchor="middle" fill="#334">LOGO</text>
  <text x="120" y="42" font-size="15" fill="#334" font-weight="bold">Jeff Jensen — Web Developer</text>
  <text x="120" y="62" font-size="12" fill="#556">site title / tagline</text>
  <text x="500" y="50" font-size="13" fill="#334">Home | About | Projects</text>

  <!-- Nav bar -->
  <rect x="10" y="88" width="680" height="34" fill="#c3d3df" stroke="#334" stroke-width="1"/>
  <text x="350" y="110" font-size="13" text-anchor="middle" fill="#334">NAV: Home &#160;&#160; About Me &#160;&#160; Projects</text>

  <!-- Hero -->
  <rect x="10" y="132" width="680" height="180" fill="#eef2f5" stroke="#334" stroke-width="1.5"/>
  <text x="350" y="205" font-size="20" text-anchor="middle" fill="#334" font-weight="bold">HERO</text>
  <text x="350" y="232" font-size="13" text-anchor="middle" fill="#556">Name + headline + short intro</text>
  <rect x="300" y="252" width="100" height="34" fill="#cfe0d8" stroke="#334"/>
  <text x="350" y="274" font-size="12" text-anchor="middle" fill="#334">[Call to Action]</text>

  <!-- Featured projects heading -->
  <text x="24" y="345" font-size="16" fill="#334" font-weight="bold">Featured Projects</text>
  <!-- 3 project cards -->
  <rect x="20" y="360" width="210" height="180" fill="#f5f7f9" stroke="#334" stroke-width="1.5"/>
  <rect x="245" y="360" width="210" height="180" fill="#f5f7f9" stroke="#334" stroke-width="1.5"/>
  <rect x="470" y="360" width="210" height="180" fill="#f5f7f9" stroke="#334" stroke-width="1.5"/>
  <rect x="35" y="375" width="180" height="90" fill="#dbe4ec" stroke="#556" stroke-dasharray="4"/>
  <rect x="260" y="375" width="180" height="90" fill="#dbe4ec" stroke="#556" stroke-dasharray="4"/>
  <rect x="485" y="375" width="180" height="90" fill="#dbe4ec" stroke="#556" stroke-dasharray="4"/>
  <text x="125" y="425" font-size="11" text-anchor="middle" fill="#556">IMAGE</text>
  <text x="350" y="425" font-size="11" text-anchor="middle" fill="#556">IMAGE</text>
  <text x="575" y="425" font-size="11" text-anchor="middle" fill="#556">IMAGE</text>
  <text x="125" y="490" font-size="12" text-anchor="middle" fill="#334">Project title</text>
  <text x="350" y="490" font-size="12" text-anchor="middle" fill="#334">Project title</text>
  <text x="575" y="490" font-size="12" text-anchor="middle" fill="#334">Project title</text>
  <text x="125" y="512" font-size="10" text-anchor="middle" fill="#556">description + link</text>
  <text x="350" y="512" font-size="10" text-anchor="middle" fill="#556">description + link</text>
  <text x="575" y="512" font-size="10" text-anchor="middle" fill="#556">description + link</text>

  <!-- Skills / highlights -->
  <text x="24" y="585" font-size="16" fill="#334" font-weight="bold">Skills &amp; Highlights</text>
  <rect x="20" y="600" width="660" height="120" fill="#f5f7f9" stroke="#334" stroke-width="1.5"/>
  <rect x="40" y="620" width="140" height="80" fill="#dbe4ec" stroke="#556" stroke-dasharray="4"/>
  <text x="110" y="664" font-size="11" text-anchor="middle" fill="#556">IMAGE</text>
  <text x="210" y="645" font-size="12" fill="#334">Text content: skills, table, or</text>
  <text x="210" y="665" font-size="12" fill="#334">short bio with links to child pages.</text>

  <!-- Links row -->
  <rect x="20" y="740" width="660" height="70" fill="#eef2f5" stroke="#334" stroke-width="1.5"/>
  <text x="350" y="770" font-size="13" text-anchor="middle" fill="#334" font-weight="bold">Links to child pages</text>
  <text x="350" y="792" font-size="12" text-anchor="middle" fill="#556">&#8594; About Me &#160;&#160;&#160; &#8594; Projects</text>

  <!-- Footer -->
  <rect x="10" y="880" width="680" height="70" fill="#dbe4ec" stroke="#334" stroke-width="1.5"/>
  <text x="350" y="910" font-size="13" text-anchor="middle" fill="#334">FOOTER</text>
  <text x="350" y="932" font-size="11" text-anchor="middle" fill="#556">copyright · contact · social links</text>

  <text x="350" y="972" font-size="0" fill="#fff"> </text>
