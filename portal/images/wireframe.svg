<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" font-family="Helvetica, Arial, sans-serif">
    <!-- Page background -->
    <rect width="1000" height="1500" fill="#f5f5f5"/>

    <!-- Browser frame (Windows 11 style) -->
    <rect x="20" y="20" width="960" height="1460" fill="#ffffff" stroke="#333" stroke-width="2" rx="8"/>
    <rect x="20" y="20" width="960" height="30" fill="#f3f3f3" stroke="#333" stroke-width="2"/>
    <text x="40" y="40" font-size="12" fill="#333">portal/index.html</text>

    <!-- Win11 window controls (right-aligned: minimize, maximize, close) -->
    <line x1="855" y1="36" x2="875" y2="36" stroke="#333" stroke-width="1.2"/>
    <rect x="906" y="29" width="13" height="13" fill="none" stroke="#333" stroke-width="1.2"/>
    <line x1="952" y1="29" x2="965" y2="42" stroke="#c42b1c" stroke-width="1.4"/>
    <line x1="965" y1="29" x2="952" y2="42" stroke="#c42b1c" stroke-width="1.4"/>

    <!-- =================== HEADER =================== -->
    <rect x="40" y="70" width="920" height="110" fill="#e8eef2" stroke="#666" stroke-width="1.5"/>
    <text x="50" y="90" font-size="11" fill="#666" font-weight="bold">HEADER</text>

    <!-- Logo placeholder -->
    <rect x="70" y="100" width="70" height="70" fill="#fff" stroke="#666" stroke-dasharray="4,3"/>
    <line x1="70" y1="100" x2="140" y2="170" stroke="#bbb"/>
    <line x1="140" y1="100" x2="70" y2="170" stroke="#bbb"/>
    <text x="105" y="190" text-anchor="middle" font-size="9" fill="#666">logo.png</text>

    <!-- Site title (h1) and tagline (p) -->
    <text x="170" y="125" font-size="22" font-weight="bold" fill="#222">h1 — Site Title</text>
    <line x1="170" y1="140" x2="500" y2="140" stroke="#aaa" stroke-width="6"/>
    <text x="170" y="165" font-size="12" fill="#555">p — short tagline / subtitle</text>
    <line x1="170" y1="172" x2="420" y2="172" stroke="#ccc" stroke-width="3"/>

    <!-- =================== NAV =================== -->
    <rect x="40" y="190" width="920" height="50" fill="#dde6ea" stroke="#666" stroke-width="1.5"/>
    <text x="50" y="208" font-size="11" fill="#666" font-weight="bold">NAV (ul &gt; li &gt; a)</text>

    <!-- Nav links -->
    <rect x="260" y="200" width="100" height="30" fill="#fff" stroke="#666"/>
    <text x="310" y="220" text-anchor="middle" font-size="12" fill="#222">Home</text>

    <rect x="380" y="200" width="100" height="30" fill="#fff" stroke="#666"/>
    <text x="430" y="220" text-anchor="middle" font-size="12" fill="#222">WWR</text>

    <rect x="500" y="200" width="100" height="30" fill="#fff" stroke="#666"/>
    <text x="550" y="220" text-anchor="middle" font-size="12" fill="#222">ICE</text>

    <rect x="620" y="200" width="100" height="30" fill="#fff" stroke="#666"/>
    <text x="670" y="220" text-anchor="middle" font-size="12" fill="#222">About Me</text>

    <!-- =================== MAIN =================== -->
    <rect x="40" y="250" width="920" height="1100" fill="#fafbfc" stroke="#666" stroke-width="1.5"/>
    <text x="50" y="268" font-size="11" fill="#666" font-weight="bold">MAIN</text>

    <!-- Hero section -->
    <rect x="70" y="290" width="860" height="180" fill="#eef4f7" stroke="#888" stroke-dasharray="5,4"/>
    <text x="80" y="308" font-size="10" fill="#888" font-weight="bold">HERO</text>
    <text x="500" y="360" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">h2 — Welcome Heading</text>
    <line x1="250" y1="380" x2="750" y2="380" stroke="#bbb" stroke-width="4"/>
