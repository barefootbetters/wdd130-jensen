    <text x="90" y="565" font-size="11" fill="#555">p — Click any project to view it.</text>

    <!-- Card 1 -->
    <rect x="90" y="590" width="250" height="200" fill="#f7f9fb" stroke="#999"/>
    <rect x="105" y="605" width="220" height="90" fill="#fff" stroke="#bbb" stroke-dasharray="3,3"/>
    <line x1="105" y1="605" x2="325" y2="695" stroke="#ccc"/>
    <line x1="325" y1="605" x2="105" y2="695" stroke="#ccc"/>
    <text x="215" y="715" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">h3 — Project A</text>
    <text x="215" y="735" text-anchor="middle" font-size="10" fill="#555">p — description</text>
    <text x="215" y="765" text-anchor="middle" font-size="11" fill="#18BC9C" text-decoration="underline">a — View →</text>

    <!-- Card 2 -->
    <rect x="375" y="590" width="250" height="200" fill="#f7f9fb" stroke="#999"/>
    <rect x="390" y="605" width="220" height="90" fill="#fff" stroke="#bbb" stroke-dasharray="3,3"/>
    <line x1="390" y1="605" x2="610" y2="695" stroke="#ccc"/>
    <line x1="610" y1="605" x2="390" y2="695" stroke="#ccc"/>
    <text x="500" y="715" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">h3 — Project B</text>
    <text x="500" y="735" text-anchor="middle" font-size="10" fill="#555">p — description</text>
    <text x="500" y="765" text-anchor="middle" font-size="11" fill="#18BC9C" text-decoration="underline">a — View →</text>

    <!-- Card 3 -->
    <rect x="660" y="590" width="250" height="200" fill="#f7f9fb" stroke="#999"/>
    <rect x="675" y="605" width="220" height="90" fill="#fff" stroke="#bbb" stroke-dasharray="3,3"/>
    <line x1="675" y1="605" x2="895" y2="695" stroke="#ccc"/>
    <line x1="895" y1="605" x2="675" y2="695" stroke="#ccc"/>
    <text x="785" y="715" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">h3 — Project C</text>
    <text x="785" y="735" text-anchor="middle" font-size="10" fill="#555">p — description</text>
    <text x="785" y="765" text-anchor="middle" font-size="11" fill="#18BC9C" text-decoration="underline">a — View →</text>

    <!-- Skills table section -->
    <rect x="70" y="830" width="860" height="220" fill="#fff" stroke="#888" stroke-dasharray="5,4"/>
    <text x="80" y="848" font-size="10" fill="#888" font-weight="bold">SKILLS (h2, table w/ caption, thead, tbody)</text>
    <text x="90" y="878" font-size="18" font-weight="bold" fill="#333">h2 — Skills Snapshot</text>

    <!-- Table header -->
    <rect x="90" y="895" width="820" height="32" fill="#2C3E50"/>
    <line x1="365" y1="895" x2="365" y2="1030" stroke="#fff"/>
    <line x1="640" y1="895" x2="640" y2="1030" stroke="#fff"/>
    <text x="105" y="916" font-size="12" fill="#fff" font-weight="bold">th — Topic</text>
    <text x="380" y="916" font-size="12" fill="#fff" font-weight="bold">th — Comfort</text>
    <text x="655" y="916" font-size="12" fill="#fff" font-weight="bold">th — Last Practiced</text>

    <!-- Table rows -->
    <rect x="90" y="927" width="820" height="32" fill="#fff" stroke="#ccc"/>
    <text x="105" y="948" font-size="11" fill="#333">td — HTML structure</text>
    <text x="380" y="948" font-size="11" fill="#333">td — Comfortable</text>
    <text x="655" y="948" font-size="11" fill="#333">td — Week 4</text>

    <rect x="90" y="959" width="820" height="32" fill="#ECF0F1" stroke="#ccc"/>
    <text x="105" y="980" font-size="11" fill="#333">td — CSS layout</text>
    <text x="380" y="980" font-size="11" fill="#333">td — Learning</text>
    <text x="655" y="980" font-size="11" fill="#333">td — Week 5</text>

    <rect x="90" y="991" width="820" height="32" fill="#fff" stroke="#ccc"/>
    <text x="105" y="1012" font-size="11" fill="#333">td — Forms</text>
    <text x="380" y="1012" font-size="11" fill="#333">td — New</text>
    <text x="655" y="1012" font-size="11" fill="#333">td — Week 6</text>

    <!-- Contact form section -->
    <rect x="70" y="1070" width="860" height="260" fill="#fff" stroke="#888" stroke-dasharray="5,4"/>
    <text x="80" y="1088" font-size="10" fill="#888" font-weight="bold">CONTACT (h2, p, form w/ labels, inputs, button)</text>
    <text x="90" y="1118" font-size="18" font-weight="bold" fill="#333">h2 — Get in Touch</text>
    <text x="90" y="1140" font-size="11" fill="#555">p — Have a question? Drop a note.</text>

    <!-- Form fields -->
    <text x="90" y="1170" font-size="11" fill="#333" font-weight="bold">label — Name</text>
    <rect x="90" y="1175" width="380" height="28" fill="#fff" stroke="#666"/>
    <text x="100" y="1193" font-size="11" fill="#bbb">input type="text"</text>

    <text x="490" y="1170" font-size="11" fill="#333" font-weight="bold">label — Email</text>
    <rect x="490" y="1175" width="380" height="28" fill="#fff" stroke="#666"/>
    <text x="500" y="1193" font-size="11" fill="#bbb">input type="email"</text>

    <text x="90" y="1225" font-size="11" fill="#333" font-weight="bold">label — Message</text>
    <rect x="90" y="1230" width="780" height="60" fill="#fff" stroke="#666"/>
    <text x="100" y="1248" font-size="11" fill="#bbb">textarea</text>

    <rect x="90" y="1300" width="140" height="32" fill="#18BC9C" stroke="#666"/>
    <text x="160" y="1321" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">button — Send</text>

    <!-- =================== FOOTER =================== -->
    <rect x="40" y="1360" width="920" height="100" fill="#2C3E50" stroke="#666" stroke-width="1.5"/>
    <text x="50" y="1378" font-size="11" fill="#aac" font-weight="bold">FOOTER</text>
    <text x="500" y="1405" text-anchor="middle" font-size="13" fill="#fff">p — © 2026 Jeff Jensen · WDD 130 · BYU-Idaho</text>
    <text x="500" y="1435" text-anchor="middle" font-size="12" fill="#bcd">a — About    |    a — Site Plan    |    a — Email</text>
</svg>
